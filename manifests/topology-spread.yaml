apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: topology-demo
  template:
    metadata:
      labels:
        app: topology-demo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: topology-demo
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: 50m
              memory: 64Mi