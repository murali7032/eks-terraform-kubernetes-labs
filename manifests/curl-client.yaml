apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl-test
  namespace: mesh-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  namespace: mesh-lab
spec:
  serviceAccountName: curl-test
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sh", "-c", "sleep 3600"]
