apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: mesh-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v2
  template:
    metadata:
      labels:
        app: backend
        version: v2
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:80"
            - "-text=Hello from backend-v2"
          ports:
            - containerPort: 80