apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
      version: blue
  template:
    metadata:
      labels:
        app: demo-app
        version: blue
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - 'echo "BLUE VERSION v1" > /usr/share/nginx/html/index.html && nginx -g "daemon off;"'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
      version: green
  template:
    metadata:
      labels:
        app: demo-app
        version: green
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - 'echo "GREEN VERSION v2" > /usr/share/nginx/html/index.html && nginx -g "daemon off;"'
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: ClusterIP
  selector:
    app: demo-app
    version: blue
  ports:
  - port: 80
    targetPort: 80
