apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-demo
  template:
    metadata:
      labels:
        app: gateway-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-demo
  namespace: default
spec:
  type: NodePort
  selector:
    app: gateway-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

