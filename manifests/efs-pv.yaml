apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-pv
spec:
  capacity:
    storage: 5Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: efs-sc

  csi:
    driver: efs.csi.aws.com
    # Replace with the Terraform output: efs_file_system_id.
    volumeHandle: REPLACE_WITH_EFS_FILE_SYSTEM_ID
