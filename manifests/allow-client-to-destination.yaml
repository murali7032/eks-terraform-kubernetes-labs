apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-destination
spec:
  podSelector:
    matchLabels:
      app: egress-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: egress-destination
      ports:
        - protocol: TCP
          port: 80