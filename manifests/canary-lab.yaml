apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo '<h1>STABLE VERSION v1</h1>' > /usr/share/nginx/html/index.html
              nginx -g 'daemon off;'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: canary-demo
        track: canary
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo '<h1>CANARY VERSION v2</h1>' > /usr/share/nginx/html/index.html
              nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: canary-demo
spec:
  type: ClusterIP
  selector:
    app: canary-demo
  ports:
    - port: 80
      targetPort: 80